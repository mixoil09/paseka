<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — Пасека</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="hive-theme">
<header class="site-header">
    <a href="index.html" class="logo">🐝 Пасека</a>
    <nav class="site-nav">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="about.html">О пасеке</a>
        <a href="cart.html">Корзина<span id="cart-count">0</span></a>
    </nav>
</header>

<main class="container">
    <section class="section" style="max-width: 800px; margin: 0 auto;">
        <h1>Личный кабинет</h1>
        <div id="profile-content"><p>Загрузка...</p></div>
    </section>
</main>

<footer class="site-footer">
    © 2026 Пасека. Все права защищены.
</footer>

<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // Проверяем, авторизован ли пользователь
    const user = auth.getCurrentUser();
    
    // Если НЕТ — перекидываем на страницу ВХОДА
    if (!user) { 
        window.location.href = 'login.html'; 
        return; 
    }

    const content = document.getElementById('profile-content');
    
    // Получаем заказы из localStorage
    const myOrderIds = JSON.parse(localStorage.getItem('my_orders') || '[]');
    const allOrders = JSON.parse(localStorage.getItem('paseka_orders') || '[]');
    
    let ordersHtml = '<p style="color:var(--text-muted)">Вы пока не сделали ни одного заказа.</p>';
    
    if (myOrderIds.length > 0) {
        const myOrders = allOrders.filter(o => myOrderIds.includes(o.id));
        if (myOrders.length > 0) {
            ordersHtml = `<table class="cart-table" style="margin-top: 20px;"><thead><tr><th>№</th><th>Дата</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>
            ${myOrders.map(o => {
                let sColor = o.status === 'approved' ? '#4ade80' : (o.status === 'rejected' ? '#ff6b6b' : '#f5b700');
                let sText = o.status === 'approved' ? 'Одобрен' : (o.status === 'rejected' ? 'Отклонен' : 'В обработке');
                return `<tr><td>#${o.id}</td><td>${new Date(o.created_at).toLocaleDateString('ru-RU')}</td><td>${o.total} ₽</td><td><span style="color: ${sColor}">${sText}</span></td></tr>`;
            }).join('')}
            </tbody></table>`;
        }
    }

    // Выводим данные пользователя и заказы
    content.innerHTML = `
        <p style="font-size:1.2rem; margin-bottom:20px;">Привет, <strong style="color:var(--primary)">${user.name}</strong>!</p>
        <h2 style="margin-bottom:20px;">Мои заказы</h2>
        ${ordersHtml}
    `;
});
</script>
</body>
</html>
