<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Пасека</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Проверка авторизации (Mock API) -->
    <script>
        const user = JSON.parse(localStorage.getItem('current_user') || 'null');
        if (!user || user.role !== 'admin') {
            alert('Доступ запрещен. Войдите как администратор.');
            window.location.href = 'login.html';
        }
    </script>

    <!-- Подключаем React и Babel через CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="hive-theme">
    
    <!-- Шапка (упрощенная для админки) -->
    <header class="site-header">
        <a href="index.html" class="logo">🐝 Пасека (Админ)</a>
        <nav class="site-nav">
            <a href="index.html">На сайт</a>
            <a href="#" onclick="localStorage.removeItem('current_user'); window.location.href='login.html';">Выход</a>
        </nav>
    </header>

    <main class="container" style="padding: 40px 20px; min-height: 80vh;">
        <h1 style="text-align: center; margin-bottom: 30px; color: var(--primary-hover);">Управление заказами</h1>
        
        <!-- Сюда React отрендерит таблицу заказов -->
        <div id="admin-root"></div>
    </main>

    <!-- Код на React (JSX) -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function AdminApp() {
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);

            // Загружаем заказы из localStorage (наша имитация БД)
            useEffect(() => {
                const savedOrders = JSON.parse(localStorage.getItem('paseka_orders') || '[]');
                setOrders(savedOrders.reverse()); // Сначала новые
                setLoading(false);
            }, []);

            // Функция смены статуса заказа
            const updateStatus = (orderId, newStatus) => {
                const updatedOrders = orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o);
                setOrders(updatedOrders);
                
                // Сохраняем обратно в localStorage
                // (делаем reverse(), чтобы вернуть исходный порядок хранения)
                localStorage.setItem('paseka_orders', JSON.stringify(updatedOrders.slice().reverse()));
            };

            if (loading) return <p style={{ textAlign: 'center', color: '#fff' }}>Загрузка заказов...</p>;

            return (
                <div style={{ background: 'var(--surface)', borderRadius: '14px', padding: '20px', border: '1px solid var(--border)' }}>
                    {orders.length === 0 ? (
                        <p style={{ color: 'var(--text-muted)', textAlign: 'center' }}>Заказов пока нет. Сделайте тестовый заказ на сайте.</p>
                    ) : (
                        <table className="cart-table" style={{ margin: 0 }}>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Дата</th>
                                    <th>Клиент</th>
                                    <th>Сумма</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                {orders.map(order => {
                                    // Настройки цвета и текста для статусов
                                    let sColor = order.status === 'approved' ? '#4ade80' : (order.status === 'rejected' ? '#ff6b6b' : '#f5b700');
                                    let sText = order.status === 'approved' ? 'Одобрен' : (order.status === 'rejected' ? 'Отклонен' : 'Новый');

                                    return (
                                        <tr key={order.id}>
                                            <td>#{order.id}</td>
                                            <td>{new Date(order.created_at).toLocaleDateString('ru-RU')}</td>
                                            <td>
                                                {order.customer_name}<br/>
                                                <small style={{ color: 'var(--text-muted)' }}>{order.phone}</small>
                                            </td>
                                            <td>{order.total} ₽</td>
                                            <td><span style={{ color: sColor, fontWeight: 'bold' }}>{sText}</span></td>
                                            <td>
                                                {order.status === 'new' ? (
                                                    <div style={{ display: 'flex', gap: '5px' }}>
                                                        <button onClick={() => updateStatus(order.id, 'approved')} style={{ background: '#4ade80', color: '#000', padding: '6px 12px', borderRadius: '5px', cursor: 'pointer', border: 'none', fontWeight: 'bold' }}>Одобрить</button>
                                                        <button onClick={() => updateStatus(order.id, 'rejected')} style={{ background: '#ff6b6b', color: '#fff', padding: '6px 12px', borderRadius: '5px', cursor: 'pointer', border: 'none', fontWeight: 'bold' }}>Отказ</button>
                                                    </div>
                                                ) : (
                                                    <span style={{ color: 'gray', fontSize: '0.9rem' }}>Обработано</span>
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    )}
                </div>
            );
        }

        // Рендерим приложение в div
        const root = ReactDOM.createRoot(document.getElementById('admin-root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
