<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель — Пасека</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('current_user') || 'null');
        if (!user || user.role !== 'admin') { alert('Доступ запрещен.'); window.location.href = '/login.php'; }
    </script>
</head>
<body class="hive-theme">
    <header class="site-header">
        <a href="/" class="logo">🐝 Пасека (Админ)</a>
        <nav class="site-nav"><a href="/">На сайт</a><a href="#" onclick="localStorage.removeItem('current_user'); window.location.href='/login.php';">Выход</a></nav>
    </header>
    <main class="container" style="padding: 40px 20px; min-height: 80vh;">
        <h1 style="text-align: center; margin-bottom: 30px;">Управление заказами</h1>
        <div id="admin-root"></div>
    </main>
    <script type="text/babel">
        const { useState, useEffect } = React;
        function AdminApp() {
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);

            const fetchOrders = () => {
                fetch('/api/admin_orders.php').then(res => res.json()).then(data => { setOrders(data); setLoading(false); });
            };
            useEffect(() => { fetchOrders(); }, []);

            const updateStatus = (orderId, newStatus) => {
                fetch('/api/admin_orders.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId, status: newStatus })
                }).then(res => res.json()).then(data => {
                    if (data.success) setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
                });
            };

            if (loading) return <p style={{textAlign: 'center'}}>Загрузка...</p>;
            return (
                <div style={{ background: 'var(--surface)', borderRadius: '14px', padding: '20px', border: '1px solid var(--border)' }}>
                    <table className="cart-table" style={{ margin: 0 }}>
                        <thead><tr><th>ID</th><th>Дата</th><th>Клиент</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr></thead>
                        <tbody>
                            {orders.map(order => {
                                let sColor = order.status === 'approved' ? '#4ade80' : (order.status === 'rejected' ? '#ff6b6b' : '#f5b700');
                                let sText = order.status === 'approved' ? 'Одобрен' : (order.status === 'rejected' ? 'Отклонен' : 'Новый');
                                return (
                                    <tr key={order.id}>
                                        <td>#{order.id}</td>
                                        <td>{new Date(order.created_at).toLocaleDateString('ru-RU')}</td>
                                        <td>{order.customer_name}<br/><small>{order.phone}</small></td>
                                        <td>{order.total} ₽</td>
                                        <td><span style={{ color: sColor, fontWeight: 'bold' }}>{sText}</span></td>
                                        <td>
                                            {order.status === 'new' ? (
                                                <div style={{ display: 'flex', gap: '5px' }}>
                                                    <button onClick={() => updateStatus(order.id, 'approved')} style={{ background: '#4ade80', color: '#000', padding: '5px 10px', borderRadius: '5px', cursor: 'pointer', border: 'none' }}>Одобрить</button>
                                                    <button onClick={() => updateStatus(order.id, 'rejected')} style={{ background: '#ff6b6b', color: '#fff', padding: '5px 10px', borderRadius: '5px', cursor: 'pointer', border: 'none' }}>Отказ</button>
                                                </div>
                                            ) : <span style={{ color: 'gray' }}>Обработано</span>}
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('admin-root')).render(<AdminApp />);
    </script>
</body>
</html>
